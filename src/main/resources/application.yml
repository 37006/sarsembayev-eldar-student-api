spring:
  application:
    name: sarsembayev-eldar-student-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/student_api}
    username: ${DB_USER:student_api}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
server:
  port: 8080
  error:
    include-message: never
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
info:
  student:
    name: Eldar Sarsembayev
    group: IT2-2301
    id: '37006'
